name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # publish the release on v* tags
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build
      - run: cmake --build build --config Release
      - name: Self-test
        run: |
          $p = Start-Process build\Release\clipjournal.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode) { throw "self-test failed at clipjournal.cpp line $($p.ExitCode)" }
      - uses: actions/upload-artifact@v7
        with:
          name: clipjournal
          path: build/Release/clipjournal.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/Release/clipjournal.exe --generate-notes
